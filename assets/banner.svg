<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="MCP LinkedIn Poster banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A66C2"/>
      <stop offset="1" stop-color="#004182"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F6F9"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70A5F5"/>
      <stop offset="1" stop-color="#4A90E2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.1" r="1">
      <stop offset="0" stop-color="#7CC0FF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#7CC0FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="sd" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#001D31" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1280" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="28" fill="url(#glow)"/>

  <!-- ============ TOP ROW: brand lockup ============ -->
  <g transform="translate(72,40)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#FFFFFF"/>
    <circle cx="28" cy="28" r="20" fill="#0A66C2"/>
    <path d="M17 32c4-6 15-6 19 0l-9 16-10-16z" fill="#FFFFFF"/>
    <text x="72" y="26" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2.5" fill="#FFFFFF">MCP</text>
    <text x="72" y="48" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2.5" fill="#9CC7F2">CONNECTOR</text>
  </g>

  <!-- ============ FLOATING PILLS (right top) ============ -->
  <g transform="translate(152,40)" font-family="Segoe UI,Roboto,sans-serif">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.10"/>
    <circle cx="18" cy="17" r="6" fill="#70A5F5"/>
    <text x="32" y="22" font-size="13" font-weight="600" fill="#EAF3FF">Streamable HTTP</text>

    <rect x="194" y="0" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.10"/>
    <circle cx="212" cy="17" r="6" fill="#70A5F5"/>
    <text x="226" y="22" font-size="13" font-weight="600" fill="#EAF3FF">stdio</text>

    <rect x="358" y="0" width="170" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.10"/>
    <circle cx="376" cy="17" r="6" fill="#70A5F5"/>
    <text x="390" y="22" font-size="13" font-weight="600" fill="#EAF3FF">Raw fetch</text>
  </g>

  <!-- ============ LEFT: hero text ============ -->
  <g transform="translate(76,150)">
    <text y="54" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">LinkedIn Poster</text>
    <rect x="0" y="68" width="176" height="6" rx="3" fill="url(#bar)"/>
    <text y="98" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#D8E8FB">Text and image posts from any MCP client,</text>
    <text y="120" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#D8E8FB">published through natural language.</text>
  </g>

  <!-- ============ RIGHT: mock post card ============ -->
  <g transform="translate(916,52)" filter="url(#sd)">
    <rect width="300" height="216" rx="18" fill="url(#card)"/>

    <!-- header -->
    <circle cx="42" cy="44" r="14" fill="#0A66C2" fill-opacity="0.14"/>
    <circle cx="42" cy="44" r="7" fill="#0A66C2"/>
    <text x="68" y="41" font-family="Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700" fill="#16191F">Muhammad Abdullah</text>
    <text x="68" y="59" font-family="Segoe UI,Roboto,sans-serif" font-size="11" fill="#667085">CTO, ASAR Global</text>

    <!-- caption skeleton -->
    <rect x="20" y="72" width="250" height="8" rx="4" fill="#E7ECF1"/>
    <rect x="20" y="86" width="214" height="8" rx="4" fill="#E7ECF1"/>
    <rect x="20" y="100" width="232" height="8" rx="4" fill="#E7ECF1"/>

    <!-- thumbnail -->
    <rect x="20" y="118" width="112" height="54" rx="10" fill="#0A66C2" fill-opacity="0.12"/>
    <path d="M30 150l16-20 12 14 10-11 16 18" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="48" cy="132" r="5" fill="#3B82F6"/>
    <text x="146" y="142" font-family="Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#0A66C2">Preview</text>
    <text x="146" y="160" font-family="Segoe UI,Roboto,sans-serif" font-size="10" fill="#667085">Image ready and rendered</text>

    <!-- actions -->
    <g stroke="#5C6B7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="29" cy="188" r="4" fill="#5C6B7A"/>
      <path d="M26 196l-4 10 10-4 12 12"/>
      <path d="M76 192h14" stroke-width="3"/>
      <path d="M132 188c-2-3 2-6 5-4 3-2 4 2 3 4l-8 4-6-2z" fill="#5C6B7A"/>
    </g>
  </g>
</svg>