<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="MCP LinkedIn Poster banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A66C2"/>
      <stop offset="1" stop-color="#00315E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70A5F5"/>
      <stop offset="1" stop-color="#4A90E2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.2" r="1">
      <stop offset="0" stop-color="#7CC0FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7CC0FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="28" fill="url(#glow)"/>

  <!-- connected-nodes motif -->
  <g stroke="#7CC0FF" stroke-width="2" opacity="0.4" fill="none">
    <circle cx="96" cy="60" r="8"/>
    <circle cx="220" cy="60" r="8"/>
    <circle cx="96" cy="128" r="8"/>
    <circle cx="220" cy="128" r="8"/>
    <circle cx="158" cy="94" r="14" fill="#7CC0FF" fill-opacity="0.55" stroke="none"/>
    <circle cx="158" cy="94" r="5" fill="#ffffff" stroke="none"/>
    <line x1="96" y1="60" x2="158" y2="94"/>
    <line x1="220" y1="60" x2="158" y2="94"/>
    <line x1="96" y1="128" x2="158" y2="94"/>
    <line x1="220" y1="128" x2="158" y2="94"/>
  </g>

  <!-- brand lockup -->
  <rect x="60" y="46" width="56" height="56" rx="12" fill="#ffffff"/>
  <circle cx="88" cy="74" r="20" fill="#0A66C2"/>
  <path d="M79 80c3-6 15-6 18 0l-9 16-9-16z" fill="#ffffff" opacity="0.95"/>
  <text x="132" y="70" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="1">MCP</text>
  <text x="132" y="96" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#9CC7F2" letter-spacing="1">CONNECTOR</text>

  <!-- title -->
  <text x="60" y="176" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="42" font-weight="800" fill="#ffffff">LinkedIn Poster</text>
  <rect x="60" y="196" width="260" height="6" rx="3" fill="url(#accent)"/>
  <text x="60" y="232" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#D8E8FB">Publish text and image posts from any MCP client</text>
  <text x="60" y="258" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#D8E8FB">via natural language, no LinkedIn SDK required.</text>

  <!-- mock post card -->
  <g transform="translate(856,52)">
    <rect width="272" height="196" rx="16" fill="#ffffff"/>
    <circle cx="26" cy="30" r="14" fill="#0A66C2" fill-opacity="0.15"/>
    <circle cx="26" cy="30" r="7" fill="#0A66C2"/>
    <text x="46" y="36" font-family="Segoe UI,Roboto,sans-serif" font-size="15" font-weight="700" fill="#16191F">Your Name</text>
    <text x="60" y="62" font-family="Segoe UI,Roboto,sans-serif" font-size="12" fill="#667085">Posted from the MCP connector</text>
    <rect x="22" y="84" width="228" height="12" rx="6" fill="#E9EEF4"/>
    <rect x="22" y="104" width="200" height="12" rx="6" fill="#E9EEF4"/>
    <rect x="22" y="124" width="214" height="12" rx="6" fill="#E9EEF4"/>
    <rect x="22" y="156" width="60" height="28" rx="14" fill="#0A66C2"/>
    <text x="34" y="175" font-family="Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#ffffff">Post</text>
    <rect x="92" y="156" width="60" height="28" rx="14" fill="#E7F3FF"/>
    <text x="100" y="175" font-family="Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#0A5285">Post</text>
  </g>
</svg>